<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Überraschung – Dreh das Rad!</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px}
    .wheel{width:min(520px,90vw);aspect-ratio:1;border-radius:50%;border:10px solid #000;position:relative;overflow:hidden;box-shadow:0 10px 0 #000;
      background: repeating-conic-gradient(#ff9ec4 0deg 30deg,#b3e5fc 30deg 60deg); /* Aperol/Bier alternierend */
      transition: transform 4.6s cubic-bezier(.2,.9,.2,1.02);
    }
    .needle{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:32px solid #000;margin:0 auto}
    .em{position:absolute;font-size:32px;filter:drop-shadow(1px 1px 0 #000)}
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Uschi-Design™</div>
    <h1>Dreh das Glücksrad! 🎯</h1>
    <div class="marquee"><span>🍹 oder 🍺 — keine Spoiler — nur drehen! — </span></div>
    <p>Rundum alternierend: Aperol, Bier, Aperol, Bier …</p>
    <div class="needle" aria-hidden="true"></div>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel" aria-label="Glücksrad mit alternierenden Feldern"></div>
      <button class="btn" id="spin">🎲 Drehen!</button>
    </div>
    <footer>Made with 💖 • Viel Spaß!</footer>
  </div>

  <script>
    // Place 12 emojis around the wheel alternating 🍹 / 🍺
    const wheel = document.getElementById('wheel');
    const segments = 12, segAngle = 360/segments;
    for(let i=0;i<segments;i++){
      const el = document.createElement('div');
      el.className = 'em';
      el.textContent = (i % 2 === 0) ? '🍹' : '🍺';
      const angle = (i*segAngle) * Math.PI/180;
      const R = 0.38; // radius factor
      el.style.left = (50 + Math.sin(angle)*R*100) + '%';
      el.style.top  = (50 - Math.cos(angle)*R*100) + '%';
      el.style.transform = 'translate(-50%,-50%)';
      wheel.appendChild(el);
    }

    const spinBtn = document.getElementById('spin');
    let spinning = false;
    spinBtn.addEventListener('click', ()=>{
      if(spinning) return;
      spinning = true;
      // choose random segment
      const k = Math.floor(Math.random()*segments); // 0..11
      const turns = 6 + Math.random()*2;
      // Align segment center to top (0deg). Background starts at 0deg with Aperol.
      const targetDeg = (segments - k) * segAngle - segAngle/2; // reverse because we rotate the wheel
      const angle = 360*turns + targetDeg;
      wheel.style.transform = `rotate(${angle.toFixed(2)}deg)`;
      setTimeout(()=>{
        if(k % 2 === 0){ // Aperol => ROM
          window.location.href = 'rom/index.html';
        } else { // Bier => LONDON
          window.location.href = 'london/index.html#autoplay=1';
        }
      }, 4700);
    });
  </script>
  <!-- Sounds -->
<audio id="s_jingle" src="assets/start_jingle.mp3" preload="auto"></audio>
<audio id="s_tadaa"  src="assets/tadaa.mp3" preload="auto"></audio>
<audio id="s_cheers" src="assets/cheers.mp3" preload="auto"></audio>

<script>
  // Elemente
  const wheel  = document.getElementById('wheel');
  const spinBtn= document.getElementById('spin');
  const sJ     = document.getElementById('s_jingle');
  const sTa    = document.getElementById('s_tadaa');
  const sCh    = document.getElementById('s_cheers');

  // --- Option 1: kurzer Jingle beim Start (wird beim ersten Klick abgespielt, falls Autoplay blockiert) ---
  function playJingleOnce(){
    if (sJ.dataset.played === "1") return;
    sJ.dataset.played = "1";
    sJ.volume = 0.9;
    sJ.play().catch(()=>{});
  }
  // Versuch direkt, plus Fallback beim ersten Klick irgendwo
  sJ.play().catch(()=>{});
  document.addEventListener('click', playJingleOnce, { once:true });

  // --- Spin-Logik (für dein 12-Segmente-Rad: Aperol/Bier im Wechsel) ---
  let spinning = false;
  const segments = 12, segAngle = 360/segments;

  spinBtn.addEventListener('click', ()=>{
    if (spinning) return;
    spinning = true;

    // Ergebnis wählen
    const k = Math.floor(Math.random()*segments); // 0..11
    const turns = 6 + Math.random()*2;
    const targetDeg = (segments - k) * segAngle - segAngle/2; // Segmentzentrum nach oben
    const angle = 360*turns + targetDeg;

    // Drehen
    wheel.style.transform = `rotate(${angle.toFixed(2)}deg)`;

    // --- Option 3: kurzer Effekt beim Ergebnis, kurz bevor weitergeleitet wird ---
    // (Timing so, dass der Sound hörbar ist, aber die Weiterleitung flüssig bleibt)
    setTimeout(()=>{
      if (k % 2 === 0) { // Aperol => Rom
        sTa.currentTime = 0; sTa.volume = 0.9; sTa.play().catch(()=>{});
      } else {           // Bier => London
        sCh.currentTime = 0; sCh.volume = 0.9; sCh.play().catch(()=>{});
      }
    }, 3800);

    // Weiterleiten nach Ende der Dreh-Animation
    setTimeout(()=>{
      if (k % 2 === 0) {
        window.location.href = 'rom/index.html';
      } else {
        window.location.href = 'london/index.html#autoplay=1';
      }
    }, 4700);
  });
</script>
</body>
</html>
