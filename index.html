<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Überraschung – Dreh das Rad!</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px;position:relative}
    .wheel{
      width:min(520px,90vw);aspect-ratio:1;border-radius:50%;border:10px solid #000;position:relative;overflow:hidden;
      box-shadow:0 10px 0 #000;
      background:repeating-conic-gradient(#ff9ec4 0deg 30deg,#b3e5fc 30deg 60deg,#ffffff 60deg 90deg); /* 🍹/🍺/🎿 */
      transition:transform 4.6s cubic-bezier(.2,.9,.2,1.02);
    }
    .needle{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:32px solid #000;margin:0 auto}
    .em{position:absolute;font-size:32px;filter:drop-shadow(1px 1px 0 #000)}
    #spin{position:relative;z-index:5;pointer-events:auto}
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">Design by Dennis™</div>
    <h1>Dreh das Glücksrad! 🎯</h1>
    <div class="marquee"><span>🍹 oder 🍺 oder 🎿 — keine Spoiler — nur drehen! — </span></div>
    <p>Aperol – Bier – Ski – im Wechsel rundherum.</p>

    <div class="needle" aria-hidden="true"></div>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel" aria-label="Glücksrad mit drei Feldern"></div>
      <button class="btn" id="spin">🎲 Drehen!</button>
    </div>

    <footer>Made with 💖 by Dennis & Chaddy – VIEL ERFOLG! 🎉</footer>
  </div>

  <!-- 🔊 Hintergrundmusik (loop) – nimm assets/landing.mp3 wenn du willst -->
  <audio id="bg" src="assets/jingle.mp3" preload="auto" loop autoplay muted playsinline></audio>
  <!-- Effekt-Sounds -->
  <audio id="s_tadaa"  src="assets/tadaa.mp3"  preload="auto"></audio>
  <audio id="s_cheers" src="assets/cheers.mp3" preload="auto"></audio>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const wheelEl = document.getElementById('wheel');
    const spinBtn = document.getElementById('spin');
    const bg      = document.getElementById('bg');
    const sT      = document.getElementById('s_tadaa');
    const sC      = document.getElementById('s_cheers');

    if (!wheelEl || !spinBtn) return;

    // Emojis setzen
    const segments=12, segAngle=360/segments, emojis=['🍹','🍺','🎿'];
    for(let i=0;i<segments;i++){
      const el=document.createElement('div'); el.className='em'; el.textContent=emojis[i%3];
      const a=(i*segAngle)*Math.PI/180, R=.38;
      el.style.left=(50+Math.sin(a)*R*100)+'%';
      el.style.top =(50-Math.cos(a)*R*100)+'%';
      el.style.transform='translate(-50%,-50%)';
      wheelEl.appendChild(el);
    }

    // Hintergrundmusik: stumm starten, beim ersten User-Impuls entmuten
    const tryPlay = () => { try{ const p=bg.play(); if(p&&p.catch)p.catch(()=>{});}catch{} };
    const unmute  = () => { try{ bg.muted=false; bg.volume=.9; tryPlay(); }catch{} };
    tryPlay(); // startet muted (autoplay erlaubt)
    ['click','touchstart','pointerdown','keydown'].forEach(ev=>{
      window.addEventListener(ev,function once(){ unmute(); window.removeEventListener(ev,once,{capture:false}); },{once:true,passive:true});
    });

    // Drehen
    let spinning=false;
    spinBtn.addEventListener('click', ()=>{
      if(spinning) return; spinning=true; unmute(); // sicherstellen, dass Musik läuft

      const k=Math.floor(Math.random()*segments);
      const turns=6+Math.random()*2;
      const targetDeg=(segments-k)*segAngle - segAngle/2;
      const angle=360*turns+targetDeg;
      wheelEl.style.transform=`rotate(${angle.toFixed(2)}deg)`;

      setTimeout(()=>{ if(k%3===0) sT?.play().catch(()=>{}); else if(k%3===1) sC?.play().catch(()=>{}); },3800);

      setTimeout(()=>{
        if(k%3===0)      location.href='rom/index.html';
        else if(k%3===1) location.href='london/index.html#autoplay=1';
        else             location.href='ski/index.html#autoplay=1';
      },4700);
    });
  });
  </script>
</body>
</html>
