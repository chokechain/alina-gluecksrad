<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Überraschung – Dreh das Rad!</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px}
    .needle{
      width:0;height:0;margin:0 auto 8px;
      border-left:18px solid transparent;border-right:18px solid transparent;border-top:32px solid #000; /* zeigt nach unten */
    }
    .wheel{
      width:min(520px,90vw);aspect-ratio:1;border-radius:50%;
      border:10px solid #000;position:relative;overflow:hidden;box-shadow:0 10px 0 #000;
      background:repeating-conic-gradient(#ff9ec4 0deg 30deg,#b3e5fc 30deg 60deg,#ffffff 60deg 90deg); /* 🍹/🍺/🎿 */
      transition:transform 4.6s cubic-bezier(.2,.9,.2,1.02);
      --rot:0deg;
    }
    .em{
      position:absolute;left:50%;top:50%;font-size:32px;filter:drop-shadow(1px 1px 0 #000);
      transform:translate(-50%,-50%) rotate(calc(-1 * var(--rot))); /* gegenrotieren -> lesbar */
      pointer-events:none;
    }
    #spin{position:relative;z-index:5}
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">Design by Dennis™</div>
    <h1>Dreh das Glücksrad! 🎯</h1>
    <div class="marquee"><span>🍹 oder 🍺 oder 🎿 — keine Spoiler — nur drehen! — </span></div>
    <p>Aperol – Bier – Ski – im Wechsel rundherum.</p>

    <div class="needle" aria-hidden="true"></div>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel" aria-label="Glücksrad mit drei Feldern"></div>
      <button class="btn" id="spin">🎲 Drehen!</button>
    </div>

    <footer>Made with 💖 by Dennis & Chaddy – VIEL ERFOLG! 🎉</footer>
  </div>

  <!-- 🎵 Happy-Birthday (passt Dateiname an, falls anders) -->
  <audio id="bg" src="assets/happy_birthday.mp3" preload="auto" loop autoplay muted playsinline></audio>
  <!-- Effekt-Sounds -->
  <audio id="s_tadaa"  src="assets/tadaa.mp3"  preload="auto"></audio>
  <audio id="s_cheers" src="assets/cheers.mp3" preload="auto"></audio>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const wheel = document.getElementById('wheel');
    const spin  = document.getElementById('spin');
    const bg    = document.getElementById('bg');
    const sT    = document.getElementById('s_tadaa');
    const sC    = document.getElementById('s_cheers');

    if(!wheel || !spin) return;

    // Emojis exakt auf Segmentzentren
    const segments=12, seg=360/segments, emojis=['🍹','🍺','🎿'], R=0.40;
    for(let i=0;i<segments;i++){
      const el=document.createElement('div'); el.className='em'; el.textContent=emojis[i%3];
      const center=i*seg+seg/2, a=center*Math.PI/180;
      const x=Math.sin(a)*R*100, y=-Math.cos(a)*R*100;
      el.style.left=`calc(50% + ${x}%)`; el.style.top=`calc(50% + ${y}%)`;
      wheel.appendChild(el);
    }
    const setRot = deg => { wheel.style.setProperty('--rot',deg+'deg'); wheel.style.transform=`rotate(${deg}deg)`; };

    // Hintergrundmusik: stumm starten, beim ersten User-Impuls entmuten
    const tryPlay=()=>{ try{ const p=bg.play(); if(p&&p.catch)p.catch(()=>{});}catch{} };
    const unmute =()=>{ try{ bg.muted=false; bg.volume=.9; tryPlay(); }catch{} };
    tryPlay();
    ['click','touchstart','pointerdown','keydown'].forEach(ev=>{
      window.addEventListener(ev,function once(){ unmute(); window.removeEventListener(ev,once,{capture:false}); },{once:true,passive:true});
    });

    // Drehen + korrektes Mapping (Zeiger zeigt nach unten -> +180°)
    let spinning=false;
    spin.addEventListener('click',()=>{
      if(spinning) return; spinning=true; unmute();

      const k = Math.floor(Math.random()*segments);     // 0..11
      const turns = 6 + Math.random()*2;
      const targetUp = (segments - k)*seg - seg/2;      // Zentrum unter die 12-Uhr-Position
      const angle = 360*turns + targetUp + 180;         // +180°, weil Zeiger nach unten zeigt

      setRot(angle);

      setTimeout(()=>{ if(k%3===0) sT?.play().catch(()=>{}); else if(k%3===1) sC?.play().catch(()=>{}); },3800);

      setTimeout(()=>{
        if (k%3===0)      location.href='rom/index.html';
        else if (k%3===1) location.href='london/index.html#autoplay=1';
        else              location.href='ski/index.html#autoplay=1';
      },4700);
    });

    setRot(0);
  });
  </script>
</body>
</html>
