<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Überraschung – Dreh das Rad!</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    .wheel-wrap{
      display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px
    }
    .needle{
      /* Dreieck, das NACH UNTEN zeigt */
      width:0;height:0;
      border-left:18px solid transparent;border-right:18px solid transparent;
      border-top:32px solid #000; /* Spitze zeigt nach unten */
      margin:0 auto 8px auto;
    }
    .wheel{
      width:min(520px,90vw);
      aspect-ratio:1/1;                 /* garantiert kreisrund */
      border-radius:50%;
      border:10px solid #000;
      position:relative; overflow:hidden;
      box-shadow:0 10px 0 #000;
      /* 🍹 / 🍺 / 🎿 im Wechsel */
      background:repeating-conic-gradient(
        #ff9ec4 0deg 30deg,   /* Aperol */
        #b3e5fc 30deg 60deg,  /* Bier */
        #ffffff 60deg 90deg   /* Ski  */
      );
      transition:transform 4.6s cubic-bezier(.2,.9,.2,1.02);
      /* aktuelle Rotations-Variable für Emoji-Gegenrotation */
      --rot: 0deg;
    }
    .em{
      position:absolute; left:50%; top:50%;
      font-size:32px; filter:drop-shadow(1px 1px 0 #000);
      /* zentrieren + GEGENROTATION, damit Emoji immer lesbar bleibt */
      transform: translate(-50%,-50%) rotate(calc(-1 * var(--rot)));
      will-change: transform;
      pointer-events:none;
    }
    #spin{ position:relative; z-index:5; }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">Design by Dennis™</div>
    <h1>Dreh das Glücksrad! 🎯</h1>
    <div class="marquee"><span>🍹 oder 🍺 oder 🎿 — keine Spoiler — nur drehen! — </span></div>
    <p>Aperol – Bier – Ski – im Wechsel rundherum.</p>

    <div class="needle" aria-hidden="true"></div>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel" aria-label="Glücksrad mit drei Feldern"></div>
      <button class="btn" id="spin">🎲 Drehen!</button>
    </div>

    <footer>Made with 💖 by Dennis & Chaddy – VIEL ERFOLG! 🎉</footer>
  </div>

  <!-- 🔊 Sounds -->
  <audio id="s_jingle" src="assets/jingle.mp3" preload="auto"></audio>
  <audio id="s_tadaa"  src="assets/tadaa.mp3"  preload="auto"></audio>
  <audio id="s_cheers" src="assets/cheers.mp3" preload="auto"></audio>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const wheelEl = document.getElementById('wheel');
    const spinBtn = document.getElementById('spin');
    const sJ = document.getElementById('s_jingle');
    const sT = document.getElementById('s_tadaa');
    const sC = document.getElementById('s_cheers');

    if(!wheelEl || !spinBtn) return;

    // --- Emoji-Positionen exakt im Segment-Zentrum ---
    const segments = 12;
    const segAngle = 360 / segments;
    const emojis = ['🍹','🍺','🎿'];
    const R = 0.40; // Radius-Faktor (0..0.5), 0.40 sitzt schön im Segment

    for(let i=0;i<segments;i++){
      const el = document.createElement('div');
      el.className = 'em';
      el.textContent = emojis[i % 3];

      // Mittelpunkt jedes Segments: i*seg + seg/2
      const centerDeg = i*segAngle + segAngle/2;
      const a = centerDeg * Math.PI / 180;

      // absolute Position auf dem Rad (wir zentrieren via left/top:50%)
      const x = Math.sin(a) * R * 100;
      const y = -Math.cos(a) * R * 100;

      el.style.left = `calc(50% + ${x}%)`;
      el.style.top  = `calc(50% + ${y}%)`;
      wheelEl.appendChild(el);
    }

    // Emoji immer lesbar halten: Gegenrotation anhand wheel-Variable --rot
    function setWheelRotation(deg){
      wheelEl.style.setProperty('--rot', deg + 'deg');
      wheelEl.style.transform = `rotate(${deg}deg)`;
    }

    // --- Sound-Helfer ---
    function play(a){ try{ a.currentTime=0; a.volume=0.9; const p=a.play(); if(p&&p.catch) p.catch(()=>{});}catch(e){} }
    function jingleOnce(){ if(sJ && sJ.dataset.played!=='1'){ sJ.dataset.played='1'; play(sJ);} }
    window.addEventListener('load', () => setTimeout(jingleOnce, 400));
    ['click','pointerdown','touchstart','keydown'].forEach(ev =>
      document.addEventListener(ev, jingleOnce, { once:true, passive:true })
    );

    // --- Drehen ---
    let spinning = false;
    spinBtn.addEventListener('click', () => {
      if(spinning) return;
      spinning = true;

      const k = Math.floor(Math.random()*segments); // 0..11
      const turns = 6 + Math.random()*2;
      const targetDeg = (segments - k) * segAngle - segAngle/2; // Segmentzentrum nach oben
      const angle = 360*turns + targetDeg;

      // Rotation + Gegenrotation der Emojis (via CSS-Var --rot)
      setWheelRotation(angle);

      // kurzer Effekt-Sound
      setTimeout(() => {
        if (k % 3 === 0 && sT) play(sT);      // 🍹 Rom
        else if (k % 3 === 1 && sC) play(sC); // 🍺 London
        else if (sJ) play(sJ);                // 🎿 Ski
      }, 3800);

      // Weiterleitung nach Ende
      setTimeout(() => {
        try{ sJ && sJ.pause(); }catch(e){}
        if (k % 3 === 0)      location.href = 'rom/index.html';
        else if (k % 3 === 1) location.href = 'london/index.html#autoplay=1';
        else                  location.href = 'ski/index.html#autoplay=1';
      }, 4700);
    });

    // Startrotation sicher auf 0 halten
    setWheelRotation(0);
  });
  </script>
</body>
</html>
